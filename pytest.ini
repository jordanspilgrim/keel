[pytest]
# Silence ONLY the known Starlette/httpx TestClient deprecation (upstream, not
# our code) so it doesn't drown out warnings we should act on. Everything else
# still surfaces.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
